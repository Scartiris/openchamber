name: Docker (pigeon)

on:
  push:
    branches: [custom]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Extra tag to push (e.g. 1.20.107). Leave empty for auto.'
        required: false
        type: string

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/scartiris/openchamber

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a05ad74fa2f72d8c2149d0292a0f484 # v3.12.0

      - name: Log in to GHCR
        uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f29267d1 # v3.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@c1e51972afc2121e065aed6d58098c1314660910b # v5.10.0
        with:
          images: ${{ env.IMAGE_NAME }}
          # custom branch -> :custom, :custom-<sha>; tag v* -> :1.20.x + :latest
          tags: |
            type=raw,value=custom,enable=${{ github.ref == 'refs/heads/custom' }}
            type=sha,format=short,prefix=custom-,enable=${{ github.ref == 'refs/heads/custom' }}
            type=semver,pattern={{version}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=${{ inputs.tag }},enable=${{ inputs.tag != '' }}

      - name: Build and push
        uses: docker/build-push-action@263435318d21b8e386c7fe6b68ad5a9d933a7e68 # v6.18.0
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64
